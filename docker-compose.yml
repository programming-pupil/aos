services:
  server:
    build:
      context: .
      dockerfile: Containerfile
      target: server-runtime
    container_name: aos-server
    environment:
      AOS_SQLITE_MAX_CONNECTIONS: ${AOS_SQLITE_MAX_CONNECTIONS:-4}
      AOS_SQLITE_BUSY_TIMEOUT_MS: ${AOS_SQLITE_BUSY_TIMEOUT_MS:-10000}
      AOS_SQLITE_ACQUIRE_TIMEOUT_SECS: ${AOS_SQLITE_ACQUIRE_TIMEOUT_SECS:-30}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY is required}
      TOKEN_ENCRYPTION_KEY: ${TOKEN_ENCRYPTION_KEY:?TOKEN_ENCRYPTION_KEY is required}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AOS_ALLOW_PUBLIC_REGISTRATION: ${AOS_ALLOW_PUBLIC_REGISTRATION:-false}
      AOSD_GITHUB_TOKEN: ${AOSD_GITHUB_TOKEN:-}
      DEFAULT_MODEL: ${DEFAULT_MODEL:-anthropic/claude-opus-4-8}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-}
      UPLOAD_MAX_FILE_BYTES: ${UPLOAD_MAX_FILE_BYTES:-52428800}
      UPLOAD_MAX_IMAGE_BYTES: ${UPLOAD_MAX_IMAGE_BYTES:-1048576}
      BOT_GATEWAY_INBOUND_POLL_SECS: ${BOT_GATEWAY_INBOUND_POLL_SECS:-10}
      PM_SCHEDULER_INTERVAL_SECS: ${PM_SCHEDULER_INTERVAL_SECS:-120}
      PM_RESEARCH_TASK_RUNTIME_POLL_SECS: ${PM_RESEARCH_TASK_RUNTIME_POLL_SECS:-5}
      PM_RESEARCH_TASK_MAX_CONCURRENT: ${PM_RESEARCH_TASK_MAX_CONCURRENT:-4}
      PM_RESEARCH_TASK_MAX_CONCURRENT_PER_TENANT: ${PM_RESEARCH_TASK_MAX_CONCURRENT_PER_TENANT:-2}
      PM_TELEMETRY_QUEUE_CAPACITY: ${PM_TELEMETRY_QUEUE_CAPACITY:-2048}
      PM_TELEMETRY_BATCH_SIZE: ${PM_TELEMETRY_BATCH_SIZE:-128}
      PM_TELEMETRY_FLUSH_MS: ${PM_TELEMETRY_FLUSH_MS:-500}
      PM_TELEMETRY_WAL_MODE: ${PM_TELEMETRY_WAL_MODE:-durable}
      PM_TELEMETRY_WAL_QUEUE_CAPACITY: ${PM_TELEMETRY_WAL_QUEUE_CAPACITY:-512}
      PM_TELEMETRY_WAL_MAX_BYTES: ${PM_TELEMETRY_WAL_MAX_BYTES:-268435456}
      PM_TELEMETRY_WAL_MAX_SEGMENTS: ${PM_TELEMETRY_WAL_MAX_SEGMENTS:-4096}
      PM_TELEMETRY_WAL_REPLAY_BATCH_SEGMENTS: ${PM_TELEMETRY_WAL_REPLAY_BATCH_SEGMENTS:-32}
      PM_TELEMETRY_RAW_RETENTION_DAYS: ${PM_TELEMETRY_RAW_RETENTION_DAYS:-7}
      PM_TELEMETRY_EVENT_RETENTION_DAYS: ${PM_TELEMETRY_EVENT_RETENTION_DAYS:-30}
      PM_TELEMETRY_RETENTION_BATCH_SIZE: ${PM_TELEMETRY_RETENTION_BATCH_SIZE:-500}
      WATCHDOG_DB_MAX_CONCURRENT: ${WATCHDOG_DB_MAX_CONCURRENT:-3}
      AOS_BOT_QUEUE_MAX_CONCURRENT: ${AOS_BOT_QUEUE_MAX_CONCURRENT:-8}
      AOS_BOT_QUEUE_MAX_CONCURRENT_PER_TENANT: ${AOS_BOT_QUEUE_MAX_CONCURRENT_PER_TENANT:-2}
      AOS_BOT_QUEUE_BATCH_SIZE: ${AOS_BOT_QUEUE_BATCH_SIZE:-5}
      TASK_CONTROL_SSE_RECOVERY_POLL_MS: ${TASK_CONTROL_SSE_RECOVERY_POLL_MS:-15000}
      AOS_RD_RUNTIME_EXECUTOR: ${AOS_RD_RUNTIME_EXECUTOR:-runtime}
      AOS_RD_RUNTIME_TIMEOUT_SECS: ${AOS_RD_RUNTIME_TIMEOUT_SECS:-1800}
      AOS_RD_TEST_COMMAND_TIMEOUT_SECS: ${AOS_RD_TEST_COMMAND_TIMEOUT_SECS:-180}
      AOS_RD_AUTO_REPAIR_MAX_ATTEMPTS: ${AOS_RD_AUTO_REPAIR_MAX_ATTEMPTS:-3}
      AOS_RD_RUNTIME_DIRECT_FALLBACK: ${AOS_RD_RUNTIME_DIRECT_FALLBACK:-false}
      AOS_RD_ARCHITECTURE_PASS_ENABLED: ${AOS_RD_ARCHITECTURE_PASS_ENABLED:-true}
      AOS_RD_REVIEWER_PASS_ENABLED: ${AOS_RD_REVIEWER_PASS_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-AOS <noreply@example.com>}
      RUST_LOG: ${RUST_LOG:-web_server=info,agent_gateway=info,runtime=info,tower_http=info,billing=info}
    ports:
      - "${AOS_BIND_HOST:-127.0.0.1}:${AOS_API_PORT:-3001}:3001"
    volumes:
      - aos-server-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3001/api/v1/setup/check >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Containerfile
      target: web-runtime
    container_name: aos-web
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${AOS_BIND_HOST:-127.0.0.1}:${AOS_WEB_PORT:-3000}:80"

volumes:
  aos-server-data:
