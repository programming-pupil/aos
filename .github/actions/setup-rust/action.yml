name: Setup Rust
description: Reuse the runner toolchain or install stable with bounded retries
inputs:
  components:
    description: Comma-separated rustup components
    required: false
    default: ""
runs:
  using: composite
  steps:
    - shell: bash
      env:
        AOS_RUST_COMPONENTS: ${{ inputs.components }}
      run: |
        set -euo pipefail
        retry() {
          local attempt=1
          local delays=(2 5 10)
          until "$@"; do
            if (( attempt > ${#delays[@]} )); then
              echo "Rust setup failed after ${attempt} attempts: $*" >&2
              return 1
            fi
            sleep "${delays[$((attempt - 1))]}"
            attempt=$((attempt + 1))
          done
        }

        if ! rustup run stable rustc --version >/dev/null 2>&1; then
          retry rustup toolchain install stable --profile minimal --no-self-update
        fi
        echo "RUSTUP_TOOLCHAIN=stable" >> "$GITHUB_ENV"

        if [[ -n "$AOS_RUST_COMPONENTS" ]]; then
          IFS=',' read -ra components <<< "$AOS_RUST_COMPONENTS"
          for component in "${components[@]}"; do
            component="${component//[[:space:]]/}"
            [[ -z "$component" ]] || retry rustup component add "$component" --toolchain stable
          done
        fi
