[package]
name = "runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
local-embedding = ["dep:anyhow", "dep:fastembed", "dep:parking_lot"]

[dependencies]
agent-protocol = { path = "../agent-protocol" }
semantic-core = { path = "../semantic-core" }
memory-engine = { path = "../memory-engine" }
sha2 = "0.10"
glob = "0.3"
async-trait = "0.1"
plugins = { path = "../plugins" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
telemetry = { path = "../telemetry" }
tokio.workspace = true
notify.workspace = true
reqwest.workspace = true
bytes.workspace = true
chrono.workspace = true
http.workspace = true
tracing.workspace = true
walkdir = "2"
tiktoken-rs = "0.12"
anyhow = { workspace = true, optional = true }
# 5.13 is the latest release using ONNX Runtime API 23, whose official
# binaries still cover every AOS release target, including macOS Intel.
fastembed = { version = "=5.17.4", default-features = false, features = ["ort-load-dynamic"], optional = true }
hex = "0.4"
parking_lot = { workspace = true, optional = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["process", "signal"] }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
